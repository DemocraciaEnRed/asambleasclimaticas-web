# Workflow para compilar y publicar el sitio Next.js en GitHub Pages
#
# To get started with Next.js see: https://nextjs.org/docs/getting-started
#
name: Deploy Next.js site to Pages

on:
  # Corre con cada push a la rama por defecto
  push:
    branches: ["deploy"]

  # Permite correr este workflow a mano desde la pestaña Actions
  workflow_dispatch:

  # Recompila cuando cambia el contenido del backoffice (webhook de Supabase -> API de GitHub, event_type "content")
  repository_dispatch:
    types: [content]

# Permisos del GITHUB_TOKEN para poder publicar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Solo un despliegue a la vez: se saltean las corridas encoladas entre la que está en curso y la última.
# Pero NO se cancela la que está en curso, para que los despliegues a producción terminen.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Compilación
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.detect-package-manager.outputs.manager }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Inyecta automáticamente basePath en la configuración de Next.js y desactiva
          # la optimización de imágenes del lado del servidor (https://nextjs.org/docs/api-reference/next/image#unoptimized).
          #
          # Se puede quitar esta línea para manejar la configuración a mano.
          static_site_generator: next
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          # Genera una caché nueva cuando cambian los paquetes o el código fuente.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          # Si cambió el código pero no los paquetes, recompila desde una caché anterior.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-
      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
      - name: Build with Next.js
        # output: 'export' en next.config.js escribe el sitio estático en ./out
        run: ${{ steps.detect-package-manager.outputs.runner }} next build
        env:
          # Variables del repositorio (Settings > Secrets and variables > Actions > Variables). Ambos valores son públicos.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # Despliegue
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4